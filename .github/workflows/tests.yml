name: tests

on:
  push:

jobs:
  main:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ['3.10', latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@main
      - uses: davidkhala/uv-buildpack@main
        with:
          test-entry-point: pytest --ignore=tests/poetry --ignore=tests/testcontainers_test.py
          version: ${{matrix.version}}
          tests: .
  testcontainers:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-15-intel, windows-latest ]
    steps:
      - if: runner.os == 'macOS'
        uses: douglascamata/setup-docker-macos-action@main
      - uses: actions/checkout@main
      - uses: davidkhala/uv-buildpack@main
        with:
          test-entry-point: pytest testcontainers_test.py
